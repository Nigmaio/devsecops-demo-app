name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simulate build
        run: echo "Building app..."

      - name: Simple secret check (demo)
        run: |
          echo "Running simple secret scan..."
          # Fail if we see an obvious fake secret pattern
          if grep -R "AWS_SECRET_ACCESS_KEY=" .; then
            echo "❌ Found hardcoded secret!"
            exit 1
          fi
          echo "✅ No obvious secrets found."

